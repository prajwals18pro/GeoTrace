<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoTrace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #10253a, #03060b 55%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: rgba(5, 12, 21, 0.94);

            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 24px;

            padding: 32px 22px;

            text-align: center;

            box-shadow:
                0 0 40px rgba(0, 180, 255, 0.12);
        }

        .satellite {
            font-size: 52px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 34px;
            letter-spacing: 4px;
        }

        h1 span {
            color: #00c8ff;
        }

        .subtitle {
            margin-top: 10px;
            color: #8295aa;
            font-size: 13px;
            line-height: 1.6;
        }

        .status {
            margin: 28px 0 20px;

            padding: 14px;

            border-radius: 13px;

            background: rgba(0, 255, 145, 0.06);
            border: 1px solid rgba(0, 255, 145, 0.25);

            color: #00ff91;

            font-size: 12px;
            letter-spacing: 1px;
        }

        .dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            background: #00ff91;
            border-radius: 50%;

            margin-right: 7px;

            box-shadow: 0 0 12px #00ff91;
        }

        .session {
            color: #65788d;
            font-size: 11px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    90deg,
                    #006eff,
                    #00c8ff
                );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0, 150, 255, 0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        .info {
            margin-top: 20px;

            color: #53677c;

            font-size: 10px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="satellite">
            🛰️
        </div>

        <h1>
            GEO<span>TRACE</span>
        </h1>

        <p class="subtitle">
            Intelligent Location Visualization System
        </p>

        <div class="status">
            <span class="dot"></span>
            SYSTEM READY
        </div>

        <div class="session">
            SESSION: GT-DEMO-001
        </div>

        <button onclick="openDashboard()">
            OPEN TRACKING DASHBOARD
        </button>

        <p class="info">
            Educational location-visualization project.
            Real device location requires browser permission.
        </p>

    </div>

    <script>
        function openDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
