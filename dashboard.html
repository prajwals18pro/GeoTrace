<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoTrace — Live Dashboard</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05070c;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    padding:18px;
    background:#0b1019;
    border-bottom:1px solid #202838;
}

.logo{
    font-size:12px;
    letter-spacing:5px;
    color:#9aaac0;
}

.title{
    font-size:25px;
    margin-top:6px;
}

.status{
    margin-top:9px;
    color:#8b98aa;
    font-size:12px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
    margin-right:6px;
}

.live .dot{
    background:#35e58a;
    box-shadow:0 0 12px #35e58a;
}

#map{
    width:100%;
    height:58vh;
    min-height:400px;
}

.panel{
    background:#080c13;
    padding:15px;
}

.panel-title{
    color:#7f8c9e;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#0d131d;
    border:1px solid #1c2634;
    border-radius:12px;
    padding:14px;
}

.card span{
    display:block;
    color:#6e7b8d;
    font-size:10px;
    margin-bottom:7px;
}

.card strong{
    font-size:14px;
}

.footer{
    text-align:center;
    padding:18px;
    color:#4e5969;
    font-size:9px;
    letter-spacing:1px;
}

.target{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ff304f;
    border:4px solid rgba(255,48,79,.25);
    box-shadow:0 0 20px rgba(255,48,79,.9);
}

.leaflet-popup-content-wrapper{
    background:#0d131d;
    color:white;
}

.leaflet-popup-tip{
    background:#0d131d;
}

</style>

</head>

<body>


<div class="header">

    <div class="logo">
        GEOTRACE
    </div>

    <div class="title">
        Live Location
    </div>

    <div
        class="status"
        id="status"
    >
        <span class="dot"></span>
        CONNECTING...
    </div>

</div>


<div id="map"></div>


<div class="panel">

    <div class="panel-title">
        LIVE TELEMETRY
    </div>

    <div class="grid">

        <div class="card">
            <span>LATITUDE</span>
            <strong id="lat">—</strong>
        </div>

        <div class="card">
            <span>LONGITUDE</span>
            <strong id="lng">—</strong>
        </div>

        <div class="card">
            <span>ACCURACY</span>
            <strong id="accuracy">—</strong>
        </div>

        <div class="card">
            <span>SPEED</span>
            <strong id="speed">—</strong>
        </div>

        <div class="card">
            <span>DIRECTION</span>
            <strong id="heading">—</strong>
        </div>

        <div class="card">
            <span>LAST UPDATE</span>
            <strong id="updated">—</strong>
        </div>

    </div>

</div>


<div class="footer">
    GEOTRACE • REAL-TIME CONSENT-BASED LOCATION
</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

/*
   IMPORTANT:

   Use EXACTLY the SAME Firebase config
   that is working in your share.html.

   Copy the complete firebaseConfig block
   from share.html and put it here.
*/

const firebaseConfig = {
  apiKey: "AIzaSyAE_D_Ti3XP_QUKe-1vlRtfPGhA4V5sh_4",
  authDomain: "geotrace-7d9b4.firebaseapp.com",
  databaseURL: "https://geotrace-7d9b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotrace-7d9b4",
  storageBucket: "geotrace-7d9b4.firebasestorage.app",
  messagingSenderId: "228382891049",
  appId: "1:228382891049:web:c4a978d058ea041d61d038"
};

    



/* =========================================
   FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const database =
    getDatabase(app);



/* =========================================
   ELEMENTS
========================================= */

const status =
    document.getElementById("status");


const latElement =
    document.getElementById("lat");


const lngElement =
    document.getElementById("lng");


const accuracyElement =
    document.getElementById("accuracy");


const speedElement =
    document.getElementById("speed");


const headingElement =
    document.getElementById("heading");


const updatedElement =
    document.getElementById("updated");



/* =========================================
   MAP
========================================= */

const map =
    L.map("map").setView(
        [20.5937,78.9629],
        5
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);



/* =========================================
   MARKER
========================================= */

let marker = null;

let firstLocation = true;

let route = [];


const routeLine =
    L.polyline(
        [],
        {
            color:"#ff304f",
            weight:4,
            opacity:.7
        }
    ).addTo(map);



/* =========================================
   SESSION
========================================= */

/*
   The sharer and dashboard use the same
   background session.

   The person sharing does NOT need to
   enter anything.
*/

const sessionId =
    "GT-001";



/* =========================================
   CONNECT TO FIREBASE
========================================= */

try{

    await signInAnonymously(auth);


    status.classList.add("live");

    status.innerHTML =
        '<span class="dot"></span> WAITING FOR LOCATION';



    const locationRef =
        ref(
            database,
            "locations/" +
            sessionId +
            "/current"
        );



    /* =====================================
       REAL-TIME LISTENER
    ===================================== */

    onValue(
        locationRef,
        (snapshot) => {

            const data =
                snapshot.val();


            if(!data){

                status.classList.remove("live");

                status.innerHTML =
                    '<span class="dot"></span> WAITING FOR SHARED LOCATION';

                return;
            }


            const latitude =
                Number(data.latitude);


            const longitude =
                Number(data.longitude);


            if(
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
            ){

                return;

            }



            /* ===============================
               TELEMETRY
            =============================== */

            latElement.textContent =
                latitude.toFixed(6);


            lngElement.textContent =
                longitude.toFixed(6);


            accuracyElement.textContent =
                data.accuracy
                ? Math.round(
                    Number(data.accuracy)
                  ) + " m"
                : "—";


            speedElement.textContent =
                data.speed !== null &&
                data.speed !== undefined
                ? (
                    Number(data.speed) * 3.6
                  ).toFixed(1) + " km/h"
                : "—";


            headingElement.textContent =
                data.heading !== null &&
                data.heading !== undefined
                ? Math.round(
                    Number(data.heading)
                  ) + "°"
                : "—";


            updatedElement.textContent =
                new Date(
                    data.timestamp ||
                    Date.now()
                ).toLocaleTimeString();



            /* ===============================
               STATUS
            =============================== */

            status.classList.add("live");

            status.innerHTML =
                '<span class="dot"></span> LIVE LOCATION RECEIVED';



            /* ===============================
               MARKER
            =============================== */

            if(!marker){

                const icon =
                    L.divIcon({

                        className:"",

                        html:
                            '<div class="target"></div>',

                        iconSize:
                            [28,28],

                        iconAnchor:
                            [14,14]

                    });


                marker =
                    L.marker(
                        [
                            latitude,
                            longitude
                        ],
                        {
                            icon:icon
                        }
                    ).addTo(map);


                marker.bindPopup(
                    "<b>GEOTRACE</b><br>" +
                    "Shared device<br><br>" +
                    latitude.toFixed(6) +
                    ", " +
                    longitude.toFixed(6)
                );

            }
            else{

                marker.setLatLng(
                    [
                        latitude,
                        longitude
                    ]
                );

            }



            /* ===============================
               ROUTE
            =============================== */

            route.push(
                [
                    latitude,
                    longitude
                ]
            );


            if(route.length > 100){

                route.shift();

            }


            routeLine.setLatLngs(route);



            /* ===============================
               FIRST LOCATION
            =============================== */

            if(firstLocation){

                map.setView(
                    [
                        latitude,
                        longitude
                    ],
                    17
                );

                firstLocation = false;

            }

        },


        (error) => {

            console.error(error);

            status.classList.remove("live");

            status.innerHTML =
                '<span class="dot"></span> DATABASE ERROR';

        }
    );


}
catch(error){

    console.error(error);

    status.innerHTML =
        '<span class="dot"></span> FIREBASE CONNECTION ERROR';

}

</script>

</body>
</html>
