<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoTrace — Live Dashboard</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05070c;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    padding:18px;
    background:#0b1019;
    border-bottom:1px solid #202838;
}

.logo{
    letter-spacing:5px;
    font-size:13px;
    color:#9badc5;
}

.title{
    font-size:25px;
    margin-top:5px;
}

.status{
    margin-top:8px;
    font-size:12px;
    color:#8b98aa;
}

.live-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
    margin-right:6px;
}

.live .live-dot{
    background:#35e58a;
    box-shadow:0 0 12px #35e58a;
}

.session{
    margin-top:8px;
    color:#687588;
    font-size:11px;
}

#map{
    width:100%;
    height:55vh;
    min-height:400px;
}

.panel{
    padding:15px;
    background:#080c13;
}

.panel-title{
    color:#7e8b9d;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.card{
    background:#0d131d;
    border:1px solid #1b2431;
    border-radius:12px;
    padding:14px;
}

.card span{
    display:block;
    color:#6f7c8e;
    font-size:10px;
    margin-bottom:7px;
}

.card strong{
    font-size:15px;
}

.footer{
    text-align:center;
    padding:18px;
    color:#4e5969;
    font-size:9px;
    letter-spacing:1px;
}

.target-icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#ff304f;
    border:4px solid rgba(255,48,79,.25);
    box-shadow:0 0 20px rgba(255,48,79,.8);
}

.leaflet-popup-content-wrapper{
    background:#0c111a;
    color:white;
}

.leaflet-popup-tip{
    background:#0c111a;
}

</style>

</head>

<body>

<div class="header">

    <div class="logo">
        GEOTRACE
    </div>

    <div class="title">
        Live Location Dashboard
    </div>

    <div
        class="status"
        id="connectionStatus"
    >
        <span class="live-dot"></span>
        CONNECTING...
    </div>

    <div class="session">
        SESSION: <span id="sessionText">GT-001</span>
    </div>

</div>


<div id="map"></div>


<div class="panel">

    <div class="panel-title">
        SHARED DEVICE TELEMETRY
    </div>

    <div class="grid">

        <div class="card">
            <span>LATITUDE</span>
            <strong id="latitude">—</strong>
        </div>

        <div class="card">
            <span>LONGITUDE</span>
            <strong id="longitude">—</strong>
        </div>

        <div class="card">
            <span>ACCURACY</span>
            <strong id="accuracy">—</strong>
        </div>

        <div class="card">
            <span>SPEED</span>
            <strong id="speed">—</strong>
        </div>

        <div class="card">
            <span>DIRECTION</span>
            <strong id="heading">—</strong>
        </div>

        <div class="card">
            <span>LAST UPDATE</span>
            <strong id="updated">—</strong>
        </div>

    </div>

</div>


<div class="footer">
    GEOTRACE • REAL-TIME CONSENT-BASED LOCATION
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


// ==========================================
// FIREBASE CONFIG
// ==========================================
//
// IMPORTANT:
// Use the EXACT SAME firebaseConfig
// that is already working in share.html.
//
// Open share.html and copy its
// complete const firebaseConfig = { ... }
// block here.
//

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAE_D_Ti3XP_QUKe-1vlRtfPGhA4V5sh_4",
  authDomain: "geotrace-7d9b4.firebaseapp.com",
  databaseURL: "https://geotrace-7d9b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geotrace-7d9b4",
  storageBucket: "geotrace-7d9b4.firebasestorage.app",
  messagingSenderId: "228382891049",
  appId: "1:228382891049:web:c4a978d058ea041d61d038",
  measurementId: "G-F0ZE8RND9M"
};


// ==========================================
// FIREBASE
// ==========================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


// ==========================================
// SESSION
// ==========================================

const sessionId = "GT-001";

document.getElementById("sessionText")
    .textContent = sessionId;


// ==========================================
// MAP
// ==========================================

const map = L.map("map").setView(
    [20.5937,78.9629],
    5
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


// ==========================================
// LIVE TARGET MARKER
// ==========================================

let targetMarker = null;

let firstLocation = true;

let routePoints = [];

let routeLine = L.polyline(
    [],
    {
        color:"#ff304f",
        weight:4,
        opacity:.75
    }
).addTo(map);


// ==========================================
// UI
// ==========================================

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const latitude =
    document.getElementById("latitude");

const longitude =
    document.getElementById("longitude");

const accuracy =
    document.getElementById("accuracy");

const speed =
    document.getElementById("speed");

const heading =
    document.getElementById("heading");

const updated =
    document.getElementById("updated");


// ==========================================
// CONNECT TO FIREBASE
// ==========================================

try{

    await signInAnonymously(auth);

    connectionStatus.classList.add("live");

    connectionStatus.innerHTML =
        '<span class="live-dot"></span> LIVE DATABASE CONNECTED';


    const locationRef =
        ref(
            db,
            "locations/" +
            sessionId +
            "/current"
        );


    // ======================================
    // REAL-TIME LOCATION LISTENER
    // ======================================

    onValue(
        locationRef,
        (snapshot) => {

            const data =
                snapshot.val();


            if(!data){

                connectionStatus.innerHTML =
                    '<span class="live-dot"></span> WAITING FOR SHARED DEVICE';

                return;
            }


            const lat =
                Number(data.latitude);

            const lng =
                Number(data.longitude);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ){
                return;
            }


            // ==================================
            // UPDATE TELEMETRY
            // ==================================

            latitude.textContent =
                lat.toFixed(6);

            longitude.textContent =
                lng.toFixed(6);


            accuracy.textContent =
                data.accuracy
                ? Math.round(data.accuracy) + " m"
                : "—";


            speed.textContent =
                data.speed != null
                ? (Number(data.speed) * 3.6).toFixed(1) + " km/h"
                : "—";


            heading.textContent =
                data.heading != null
                ? Math.round(data.heading) + "°"
                : "—";


            updated.textContent =
                new Date(
                    data.timestamp || Date.now()
                ).toLocaleTimeString();


            connectionStatus.classList.add("live");

            connectionStatus.innerHTML =
                '<span class="live-dot"></span> LIVE LOCATION RECEIVED';


            // ==================================
            // TARGET ICON
            // ==================================

            if(!targetMarker){

                const icon =
                    L.divIcon({

                        className:"",
                        html:
                            '<div class="target-icon"></div>',

                        iconSize:[26,26],

                        iconAnchor:[13,13]

                    });


                targetMarker =
                    L.marker(
                        [lat,lng],
                        {icon:icon}
                    ).addTo(map);


                targetMarker.bindPopup(
                    "<b>GEOTRACE SHARED DEVICE</b><br>" +
                    lat.toFixed(6) +
                    ", " +
                    lng.toFixed(6)
                );

            }else{

                targetMarker.setLatLng(
                    [lat,lng]
                );

            }


            // ==================================
            // ROUTE TRAIL
            // ==================================

            routePoints.push(
                [lat,lng]
            );


            // Keep last 100 points

            if(routePoints.length > 100){

                routePoints.shift();

            }


            routeLine.setLatLngs(
                routePoints
            );


            // ==================================
            // CENTER MAP ON FIRST LOCATION
            // ==================================

            if(firstLocation){

                map.setView(
                    [lat,lng],
                    17
                );

                firstLocation = false;

            }

        },

        (error) => {

            console.error(error);

            connectionStatus.classList.remove("live");

            connectionStatus.innerHTML =
                '<span class="live-dot"></span> DATABASE CONNECTION ERROR';

        }
    );


}catch(error){

    console.error(error);

    connectionStatus.innerHTML =
        '<span class="live-dot"></span> FIREBASE AUTHENTICATION ERROR';

}

</script>

</body>
</html>
